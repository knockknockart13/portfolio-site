  <style>
    body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }

    /* Infinite vertical scroll columns */
    .scroll-viewport {
      overflow: hidden;
      height: 78vh;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
    }

    .scroll-track {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }

    .scroll-up   { animation: scrollUp   var(--speed, 40s) linear infinite; }
    .scroll-down { animation: scrollDown var(--speed, 40s) linear infinite; }

    @keyframes scrollUp {
      from { transform: translateY(0); }
      to   { transform: translateY(-50%); }
    }
    @keyframes scrollDown {
      from { transform: translateY(-50%); }
      to   { transform: translateY(0); }
    }

    /* Pause the whole track on hover for a closer look */
    .scroll-viewport:hover .scroll-track {
      animation-play-state: paused;
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-track { animation: none !important; }
      .scroll-viewport { height: auto; overflow: visible; -webkit-mask-image:none; mask-image:none; }

    /* ---- Theme toggle ---- */
    .theme-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 999px; flex: none;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.6);
      color: #1d1d1f; cursor: pointer;
      transition: background-color .2s, border-color .2s, transform .2s;
    }
    .theme-toggle:hover { transform: translateY(-1px); background: #fff; }
    .theme-toggle svg { width: 16px; height: 16px; }
    /* the icon shows the ACTION, matching aria-label: moon = go dark, sun = go light */
    .theme-toggle .tt-sun { display: none; }
    html.dark .theme-toggle { border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: #f2f2f4; }
    html.dark .theme-toggle .tt-moon { display: none; }
    html.dark .theme-toggle .tt-sun { display: block; }

    /* ---- Instagram button ----
       was bg-white/5 with an inherited near-white icon: invisible on a white section */
    .ig-link {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 14px; color: #fff;
      background: linear-gradient(45deg, #f9ce34 0%, #ee2a7b 45%, #6228d7 100%);
      box-shadow: 0 6px 18px rgba(238,42,123,.28);
      transition: transform .2s, box-shadow .2s;
    }
    .ig-link:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(238,42,123,.38); }
    .ig-link svg { width: 22px; height: 22px; }

    /* ---- Burning-paper transition ----
       A sheet in the colour we are leaving covers the page while the new theme is
       applied underneath. A radial hole grows from the toggle; the SVG turbulence
       filter tears its edge and the drop-shadows glow along that tear as embers. */
    .burn-sheet {
      position: fixed; inset: 0; z-index: 9998; pointer-events: none;
      filter: url(#burn-edge) drop-shadow(0 0 3px #ffd27a) drop-shadow(0 0 11px #ff7a18) drop-shadow(0 0 30px #ff3000);
    }
    /* The hole is cut on this inner layer, not the parent: CSS applies filter
       BEFORE mask, so masking the filtered element leaves a perfectly clean
       circle. Cutting here lets the parent's turbulence tear an edge that
       already exists. The negative inset bleeds past the viewport so the tear
       at the sheet's own border stays off-screen. */
    .burn-sheet > span {
      position: absolute; inset: -56px; display: block;
      -webkit-mask-image: radial-gradient(circle at var(--bx) var(--by), transparent var(--r), #000 calc(var(--r) + 2px));
      mask-image: radial-gradient(circle at var(--bx) var(--by), transparent var(--r), #000 calc(var(--r) + 2px));
    }

    /* ---- Dark theme ----
       The markup is Tailwind utilities with no dark: variants, so remap the few
       surface and text utilities the site actually uses. */
    html.dark { color-scheme: dark; }
    html.dark body { background: #0c0c0d; color: #f2f2f4; }
    html.dark .bg-white { background-color: #151517 !important; }

<div id="lightbox" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 p-4">

<script>
  lucide.createIcons();

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const closeBtn = document.getElementById('lightbox-close');

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.remove('hidden');
    lightbox.classList.add('flex');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.add('hidden');
    lightbox.classList.remove('flex');
    document.body.style.overflow = '';
  }

  document.querySelectorAll('.school-img').forEach(img => {
    img.addEventListener('click', () => openLightbox(img.src));
  });

  closeBtn.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) closeLightbox();
  });
</script>


<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <filter id="burn-edge" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015 0.022" numOctaves="2" seed="9" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="34" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<script>
(function () {
  var root = document.documentElement, KEY = 'kka-theme';
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;

  function apply(dark) {
    root.classList.toggle('dark', dark);
    btn.setAttribute('aria-pressed', String(dark));
    btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  apply(root.classList.contains('dark'));

  function burn(dark) {
    var stale = document.querySelector('.burn-sheet');
    if (stale) stale.remove();
    var r = btn.getBoundingClientRect();
    var sheet = document.createElement('div');
    sheet.className = 'burn-sheet';
    var paper = document.createElement('span');
    paper.style.background = getComputedStyle(document.body).backgroundColor;
    sheet.appendChild(paper);
    var bx = r.left + r.width / 2, by = r.top + r.height / 2;
    paper.style.setProperty('--bx', (bx + 56) + 'px');   // +inset bleed
    paper.style.setProperty('--by', (by + 56) + 'px');
    paper.style.setProperty('--r', '0px');
    document.body.appendChild(sheet);
    apply(dark);
    var max = Math.hypot(Math.max(bx, innerWidth - bx), Math.max(by, innerHeight - by)) * 1.18;
    var t0 = performance.now(), dur = 950;
    requestAnimationFrame(function step(now) {
      var p = Math.min(1, (now - t0) / dur);
      paper.style.setProperty('--r', (1 - Math.pow(1 - p, 2.2)) * max + 'px');
      if (p < 1) requestAnimationFrame(step); else sheet.remove();
    });
  }

  btn.addEventListener('click', function () {
    var dark = !root.classList.contains('dark');
    try { localStorage.setItem(KEY, dark ? 'dark' : 'light'); } catch (e) {}
    var noMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var canMask = CSS.supports('mask-image', 'radial-gradient(#000,#000)') ||
                  CSS.supports('-webkit-mask-image', 'radial-gradient(#000,#000)');
    if (noMotion || !canMask) { apply(dark); return; }
    burn(dark);
  });
})();
</script>
