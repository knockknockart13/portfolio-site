  <style>
    body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }

    /* Infinite vertical scroll columns */
    .scroll-viewport {
      overflow: hidden;
      height: 78vh;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
    }

    .scroll-track {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }

    .scroll-up   { animation: scrollUp   var(--speed, 40s) linear infinite; }
    .scroll-down { animation: scrollDown var(--speed, 40s) linear infinite; }

    @keyframes scrollUp {
      from { transform: translateY(0); }
      to   { transform: translateY(-50%); }
    }
    @keyframes scrollDown {
      from { transform: translateY(-50%); }
      to   { transform: translateY(0); }
    }

    /* Pause the whole track on hover for a closer look */
    .scroll-viewport:hover .scroll-track {
      animation-play-state: paused;
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-track { animation: none !important; }
      .scroll-viewport { height: auto; overflow: visible; -webkit-mask-image:none; mask-image:none; }
    }
  </style>
</head>

<!-- LIGHTBOX -->
<div id="lightbox" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 p-4">
  <button id="lightbox-close" class="absolute top-4 right-4 bg-white rounded-full p-2 shadow text-xl">✕</button>
  <img id="lightbox-img" class="max-w-full max-h-full rounded-2xl shadow-2xl" />
</div>

<script>
  lucide.createIcons();

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const closeBtn = document.getElementById('lightbox-close');

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.remove('hidden');
    lightbox.classList.add('flex');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.add('hidden');
    lightbox.classList.remove('flex');
    document.body.style.overflow = '';
  }

  document.querySelectorAll('.school-img').forEach(img => {
    img.addEventListener('click', () => openLightbox(img.src));
  });

  closeBtn.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) closeLightbox();
  });
</script>
